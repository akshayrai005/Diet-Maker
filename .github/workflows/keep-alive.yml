name: Keep Render Backend Alive

# A 10-minute ping keeps the service awake 24/7 (no cold-start delay), which costs ~744 of
# Render's 750 free monthly instance-hours for a 31-day month - within budget as long as this is
# the ONLY free-tier service on the account. If you add another always-on free service later,
# revisit this (either narrow the schedule or drop one service to a paid/scale-to-zero tier).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: # also runnable manually

jobs:
  ping:
    name: Ping Kaizen backend
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          echo "Pinging diet-maker-qry6.onrender.com/health ..."
          STATUS=$(curl -o /dev/null -s -m 60 -w "%{http_code}" https://diet-maker-qry6.onrender.com/health)
          echo "Response status: $STATUS"
          if [ "$STATUS" -eq 200 ]; then
            echo "Server is alive!"
          else
            echo "Server returned status $STATUS"
          fi
